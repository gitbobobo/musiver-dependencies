name: Build and publish public dependency archive

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag, for example v1.0.0
        required: true
        type: string
      artifact_url:
        description: Public URL of the locally verified archive to upload
        required: true
        type: string
      artifact_sha256:
        description: Expected SHA-256 of artifact_url
        required: true
        type: string
      artifact_name:
        description: Release asset filename
        required: true
        type: string
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: dependency-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve release inputs
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_URL: ${{ inputs.artifact_url }}
          INPUT_SHA256: ${{ inputs.artifact_sha256 }}
          INPUT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            url="$INPUT_URL"
            sha256="$INPUT_SHA256"
            name="$INPUT_NAME"
          else
            tag="$GITHUB_REF_NAME"
            url=""
            sha256=""
            name=""
          fi
          case "$tag" in v*) ;; *) echo "release tag must start with v" >&2; exit 1;; esac
          printf 'tag=%s\nurl=%s\nsha256=%s\nname=%s\n' "$tag" "$url" "$sha256" "$name" >> "$GITHUB_OUTPUT"
      - name: Download and verify public artifact
        if: steps.release.outputs.url != ''
        env:
          URL: ${{ steps.release.outputs.url }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          NAME: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          test -n "$NAME"
          curl --fail --location --retry 3 --output "$NAME" "$URL"
          printf '%s  %s\n' "$SHA256" "$NAME" | sha256sum --check --status
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ASSET_NAME: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          test -f README.md
          if [ -n "$ASSET_NAME" ]; then
            gh release create "$RELEASE_TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --title "Musiver dependencies $RELEASE_TAG" --notes-file README.md --verify-tag
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Musiver dependencies $RELEASE_TAG" --notes-file README.md --verify-tag
          fi
