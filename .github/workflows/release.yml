name: Build and publish public dependency archive

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag, for example v1.0.0
        required: true
        type: string
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: dependency-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release inputs
        run: |
          set -euo pipefail
          test -f README.md
          test -d recipes
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.release_tag }}"
            case "$tag" in v*) ;; *) echo "release_tag must start with v" >&2; exit 1;; esac
          fi

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Musiver dependencies $RELEASE_TAG" --notes-file README.md --verify-tag
